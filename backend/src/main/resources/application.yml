spring:
  application:
    name: mockforge

  datasource:
    url: jdbc:sqlite:${MOCKFORGE_HOME:./data}/mockforge.db
    driver-class-name: org.sqlite.JDBC
    
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterAccess=30m

server:
  port: ${MOCKFORGE_PORT:8080}
  address: ${MOCKFORGE_BIND_ADDRESS:0.0.0.0}
  shutdown: graceful
  
management:
  endpoints:
    web:
      base-path: /_mockforge
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      
mockforge:
  home: ${MOCKFORGE_HOME:./data}
  log-level: ${MOCKFORGE_LOG_LEVEL:INFO}
  storage:
    max-projects: 100
    max-records-per-resource: 10000
  runtime:
    max-delay-ms: 10000
    request-log-queue-size: 1000
  security:
    cors:
      allowed-origins: ${MOCKFORGE_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      
logging:
  level:
    root: INFO
    com.mockforge: ${mockforge.log-level}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
