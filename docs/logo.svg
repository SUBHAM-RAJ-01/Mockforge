<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#1a1a2e" stroke="#16213e" stroke-width="2"/>
  
  <!-- Forge Anvil Base -->
  <path d="M 60 120 L 140 120 L 145 135 L 55 135 Z" fill="#e94560" stroke="#c23550" stroke-width="2"/>
  
  <!-- Anvil Top -->
  <path d="M 50 100 L 150 100 L 150 120 L 50 120 Z" fill="#e94560" stroke="#c23550" stroke-width="2"/>
  
  <!-- Hammer Handle -->
  <rect x="110" y="45" width="8" height="50" rx="2" fill="#ffa500" stroke="#ff8800" stroke-width="1.5"/>
  
  <!-- Hammer Head -->
  <rect x="95" y="40" width="38" height="15" rx="2" fill="#b8b8b8" stroke="#888888" stroke-width="1.5"/>
  
  <!-- API Connection Lines (representing REST endpoints) -->
  <line x1="35" y1="70" x2="55" y2="85" stroke="#0f3460" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="90" x2="55" y2="90" stroke="#0f3460" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="110" x2="55" y2="95" stroke="#0f3460" stroke-width="2" stroke-linecap="round"/>
  
  <line x1="165" y1="70" x2="145" y2="85" stroke="#0f3460" stroke-width="2" stroke-linecap="round"/>
  <line x1="165" y1="90" x2="145" y2="90" stroke="#0f3460" stroke-width="2" stroke-linecap="round"/>
  <line x1="165" y1="110" x2="145" y2="95" stroke="#0f3460" stroke-width="2" stroke-linecap="round"/>
  
  <!-- API Endpoint Dots -->
  <circle cx="35" cy="70" r="4" fill="#00d4ff"/>
  <circle cx="35" cy="90" r="4" fill="#00d4ff"/>
  <circle cx="35" cy="110" r="4" fill="#00d4ff"/>
  
  <circle cx="165" cy="70" r="4" fill="#00ff88"/>
  <circle cx="165" cy="90" r="4" fill="#00ff88"/>
  <circle cx="165" cy="110" r="4" fill="#00ff88"/>
  
  <!-- Spark Effects (forging) -->
  <circle cx="75" cy="65" r="2" fill="#ffdd00" opacity="0.8"/>
  <circle cx="125" cy="68" r="1.5" fill="#ffdd00" opacity="0.8"/>
  <circle cx="85" cy="75" r="1.5" fill="#ffa500" opacity="0.8"/>
  <circle cx="115" cy="72" r="2" fill="#ffa500" opacity="0.8"/>
  
  <!-- Text Badge -->
  <rect x="50" y="155" width="100" height="25" rx="4" fill="#16213e" stroke="#0f3460" stroke-width="1.5"/>
  <text x="100" y="172" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00d4ff" text-anchor="middle">MockForge</text>
</svg>
